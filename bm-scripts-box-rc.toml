[bmscriptsbox]

[bmscriptsbox.info]
id = "7f4c1a9e-2d5b-4f60-a8c3-9e1b0d5f7a21"
name = "视频压缩"
desc = "基于 FFmpeg 的视频压缩脚本 | 统一输出 MP4(H.264)，画质等级控制压缩强度，可降分辨率与音频码率，一键大幅减小视频体积"
version = "1.2.0"
icon = "./imgs/img.png"

[bmscriptsbox.runtime]
language = "python"
language_version = ">=3.8"
entry = "main.py"
terminal = "inverse"
binaries = [{name = "ffmpeg"}, {name="webview-cli"}]

[bmscriptsbox.triggers.context_menu]
enabled = true
targets = ["files"]
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[bmscriptsbox.triggers.shortcut]
enabled = true
input_type = "files"
filters = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
           ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]

[[bmscriptsbox.inputs]]
name = "target_paths"
type = "list"
exts = [".mp4", ".mkv", ".avi", ".mov", ".webm", ".flv", ".wmv", ".ts", ".m4v",
        ".mpg", ".mpeg", ".m2ts", ".mts", ".3gp", ".ogv", ".vob", ".rmvb", ".rm", ".asf"]
